name: Hämta releaser

on:
  schedule:
    - cron: '0 5 * * *'   # varje dag 05:00 UTC — listan roteras över flera dygn
  workflow_dispatch:       # + knapp för att köra manuellt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # skriptet har egen 8-minutersbudget under detta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämta från Spotify
        env:
          SPOTIFY_ID: ${{ secrets.SPOTIFY_ID }}
          SPOTIFY_SECRET: ${{ secrets.SPOTIFY_SECRET }}
        run: node scripts/hamta-releaser.mjs

      - name: Commit
        run: |
          git config user.name "hardlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/releases.json data/artist-ids.json data/status.json
          git diff --staged --quiet || git commit -m "Nya releaser $(date +%F)"
          git push
